<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">

    <!-- Responsive viewport tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 20px;
        }

        .product-card {
            background-color: white;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .product-card img {
            width: 100%;
            max-width: 200px;
            height: 180px;
            object-fit: contain;
        }

        .product-card h2 {
            font-size: 20px;
            color: #212121;
        }

        .price {
            color: #388e3c;
            font-size: 22px;
            font-weight: bold;
        }

        .rating {
            background-color: #388e3c;
            color: white;
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
        }

        button {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #1557b0;
        }

        /* Mobile responsive design */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .product-card {
                max-width: 100%;
            }

            .product-card h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
      <div class="product-card">

        <img
            src="https://placehold.co/300x200?text=Headphones"
            alt="Wireless Bluetooth Headphones">

        <h2>Wireless Bluetooth Headphones</h2>

        <p class="rating">4.5 ★</p>

        <p class="price">₹999</p>

        <p>Comfortable headphones with clear sound
           and long battery life.</p>

        <button>Add to Cart</button>

    </div>
</body>
</html>
