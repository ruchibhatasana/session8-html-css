<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 20px;
        }

        .product-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            background-color: white;
            max-width: 650px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .product-card img {
            width: 220px;
            max-width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product-details {
            flex: 1;
        }

        h2 {
            font-size: 22px;
            color: #212121;
        }

        .price {
            color: #388e3c;
            font-size: 24px;
            font-weight: bold;
        }

        .rating {
            background-color: #388e3c;
            color: white;
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
        }

        button {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Mobile layout */
        @media screen and (max-width: 600px) {
            .product-card {
                flex-direction: column;
                text-align: center;
            }

            .product-card img {
                width: 100%;
                max-width: 250px;
            }

            .product-details {
                width: 100%;
            }

            h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    
    <div class="product-card">

        <img
            src="https://placehold.co/300x200?text=Headphones"
            alt="Wireless Bluetooth Headphones">

        <div class="product-details">
            <h2>Wireless Bluetooth Headphones</h2>

            <p class="rating">4.5 ★</p>

            <p class="price">₹999</p>

            <p>Enjoy clear sound and long battery life.</p>

            <button>Add to Cart</button>
        </div>

    </div>
</body>
</html>
