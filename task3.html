<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 20px;
        }

        .product-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: white;
            max-width: 700px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .product-card img {
            width: 220px;
            max-width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product-details {
            flex: 1;
        }

        h2 {
            font-size: 24px;
            margin-top: 0;
        }

        p {
            font-size: 16px;
        }

        .price {
            color: #388e3c;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Breakpoint 1: 600px and below */
        @media only screen and (max-width: 600px) {
            .product-card {
                flex-direction: column;
                text-align: center;
                padding: 12px;
            }

            h2 {
                font-size: 18px;
            }

            p {
                font-size: 14px;
            }

            .price {
                font-size: 20px;
            }

            button {
                padding: 10px 15px;
                font-size: 14px;
            }
        }

        /* Breakpoint 2: 601px to 900px */
        @media only screen and (min-width: 601px) and (max-width: 900px) {
            .product-card {
                padding: 18px;
            }

            h2 {
                font-size: 21px;
            }

            p {
                font-size: 15px;
            }

            .price {
                font-size: 22px;
            }
        }

        /* Breakpoint 3: 901px to 1200px */
        @media only screen and (min-width: 901px) and (max-width: 1200px) {
            .product-card {
                padding: 25px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            .price {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    
    <div class="product-card">

        <img
            src="https://placehold.co/300x200?text=Headphones"
            alt="Wireless Bluetooth Headphones">

        <div class="product-details">
            <h2>Wireless Bluetooth Headphones</h2>

            <p>Rating: 4.5 ★</p>

            <p class="price">₹999</p>

            <p>Enjoy clear sound and long battery life.</p>

            <button>Add to Cart</button>
        </div>

    </div>
</body>
</html>
